name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Dépendances (CPU, sans gsplat ni VGGT)
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" opencv-python-headless open_clip_torch plyfile tqdm viser pytest
      - name: Tests
        run: pytest -q
